<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software</title>
<link rel="stylesheet" href="/myfiles/explorer.css">
<style>
  :root {
    --sw-bg: #F8FAFC;
    --sw-surface: #ffffff;
    --sw-border: #E5EAF0;
    --sw-border-strong: #D2DAE4;
    --sw-text: #111827;
    --sw-text-secondary: #64748B;
    --sw-text-muted: #94A3B8;
    --sw-accent: #0087EB;
    --sw-accent-soft: #EAF5FF;
    --sw-green: #0087EB;
    --sw-green-soft: #EAF5FF;
    --sw-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 20px rgba(0, 135, 235, 0.05);
  }

  body {
    background: #ffffff;
  }

  .sw-page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 30px 24px 90px;
  }

  .sw-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    padding: 8px 0 22px;
  }

  .sw-header h1 {
    margin: 0 0 8px;
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 700;
    letter-spacing: 0;
    color: var(--sw-text);
  }

  .sw-header p {
    margin: 0;
    color: var(--sw-text-secondary);
    font-size: 14px;
    line-height: 1.6;
    max-width: 720px;
  }

  .sw-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 4px 0 18px;
  }

  .sw-search {
    flex: 1 1 260px;
    min-width: 200px;
    padding: 11px 13px;
    border: 1px solid var(--sw-border-strong);
    border-radius: 9px;
    background: var(--sw-surface);
    box-shadow: var(--sw-shadow);
    font-size: 13px;
    color: var(--sw-text);
    outline: none;
  }

  .sw-search:focus {
    border-color: #B1E3FF;
    box-shadow: 0 0 0 3px rgba(0, 135, 235, 0.12);
  }

  .sw-cats {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .sw-cat {
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--sw-text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .sw-cat:hover {
    border-color: transparent;
    background: rgba(177, 227, 255, 0.45);
    color: var(--sw-accent);
  }

  .sw-cat[aria-pressed="true"] {
    background: #B1E3FF;
    border-color: rgba(0, 135, 235, 0.18);
    color: #0087EB;
  }

  .sw-section {
    margin: 30px 0 0;
    scroll-margin-top: 90px;
  }

  .sw-section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
  }

  .sw-section-head .sw-count {
    min-width: 24px;
    height: 24px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: #EAF5FF;
    color: #0087EB;
    font-size: 12px;
    font-weight: 700;
  }

  .sw-section-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--sw-text);
  }

  .sw-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }

  .sw-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 168px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 12px;
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 1), 0 16px 32px rgba(0, 135, 235, 0.05);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .sw-card:hover {
    transform: translateY(-2px);
  }

  /* 浅色模式与 Portal 网址卡片一致：细线边框（排版即 UI），hover 用暖金强调色 + 薄荷光晕 */
  html:not([data-theme="space"]) .sw-card {
    border: 1px solid rgba(15, 23, 42, 0.05);
  }
  html:not([data-theme="space"]) .sw-card:hover {
    border-color: #FFE0AE;
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 18px 40px -12px rgba(168, 255, 225, 0.5);
  }

  .sw-card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .sw-logo {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: linear-gradient(135deg, #B1E3FF, #EAF5FF);
    color: #0087EB;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0;
  }

  .sw-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--sw-text);
    overflow-wrap: anywhere;
  }

  .sw-card .sw-desc {
    margin: 0;
    color: var(--sw-text-secondary);
    font-size: 13px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }

  .sw-card-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: auto;
  }

  .sw-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .sw-btn-download {
    background: var(--sw-green-soft);
    border: 1px solid rgba(0, 135, 235, 0.18);
    color: var(--sw-accent);
  }

  .sw-btn-download:hover {
    background: rgba(0, 135, 235, 0.14);
    border-color: rgba(0, 135, 235, 0.30);
    color: #005FB8;
    box-shadow: 0 0 0 3px rgba(0, 135, 235, 0.08);
  }

  .sw-btn-site {
    background: var(--sw-surface);
    border: 1px solid var(--sw-border-strong);
    color: var(--sw-text-secondary);
  }

  .sw-btn-site:hover {
    border-color: #B1E3FF;
    color: var(--sw-accent);
  }

  .sw-empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--sw-text-secondary);
    font-size: 14px;
    background: var(--sw-surface);
    border: 1px dashed var(--sw-border-strong);
    border-radius: 8px;
  }

  .sw-note {
    margin: 26px 0 0;
    padding: 12px 14px;
    border: 1px solid #fde68a;
    border-radius: 8px;
    background: #fffbeb;
    color: #92400e;
    font-size: 12.5px;
    line-height: 1.6;
  }

  /* ---- 深色模式：跟随主应用 space 主题 ---- */
  html[data-theme="space"] {
    color-scheme: dark;
    --sw-surface: rgba(26, 27, 38, 0.72);
    --sw-border: rgba(255, 255, 255, 0.08);
    --sw-border-strong: rgba(255, 255, 255, 0.14);
    --sw-text: #F4F6FB;
    --sw-text-secondary: #A4ABC1;
    --sw-text-muted: #7F88A5;
    --sw-accent: #6EA8FF;
    --sw-accent-soft: rgba(110, 168, 255, 0.14);
    --sw-green: #4BE0C2;
    --sw-green-soft: rgba(75, 224, 194, 0.12);
    --sw-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 28px rgba(0, 0, 0, 0.32);
  }

  html[data-theme="space"] body {
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(110, 168, 255, 0.10), transparent 60%),
      radial-gradient(700px 420px at -5% 110%, rgba(75, 224, 194, 0.07), transparent 60%),
      linear-gradient(180deg, #0D0E12 0%, #121118 100%);
    background-attachment: fixed;
  }

  html[data-theme="space"] .topbar {
    background: rgba(20, 18, 26, 0.6);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  html[data-theme="space"] .breadcrumb {
    background: rgba(20, 18, 26, 0.55);
    border-color: rgba(255, 255, 255, 0.10);
  }
  html[data-theme="space"] .breadcrumb a { color: #B9BEDD; }
  html[data-theme="space"] .breadcrumb a:hover { color: #ffffff; }
  html[data-theme="space"] .breadcrumb .sep { color: #8C93B8; }
  html[data-theme="space"] .breadcrumb .current { color: #ffffff; }
  html[data-theme="space"] .footer { color: #8C93B8; }

  html[data-theme="space"] .sw-search:focus {
    border-color: rgba(110, 168, 255, 0.60);
    box-shadow: 0 0 0 3px rgba(110, 168, 255, 0.16), 0 0 18px rgba(110, 168, 255, 0.08);
  }

  html[data-theme="space"] .sw-cat:hover {
    background: rgba(110, 168, 255, 0.14);
    color: #A8D8FF;
  }
  html[data-theme="space"] .sw-cat[aria-pressed="true"] {
    background: rgba(110, 168, 255, 0.22);
    border-color: rgba(110, 168, 255, 0.32);
    color: #E7F4FF;
  }

  html[data-theme="space"] .sw-section-head .sw-count {
    background: rgba(110, 168, 255, 0.14);
    color: #A8D8FF;
  }

  html[data-theme="space"] .sw-logo {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.24), rgba(75, 224, 194, 0.13));
    border: 1px solid rgba(110, 168, 255, 0.18);
    color: #A8D8FF;
  }

  html[data-theme="space"] .sw-card {
    background: rgba(26, 27, 38, 0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-color: rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.04), 0 12px 28px rgba(0, 0, 0, 0.32);
  }

  html[data-theme="space"] .sw-card:hover {
    transform: translateY(-2px);
    border-color: rgba(110, 168, 255, 0.26);
    box-shadow: 0 16px 32px -14px rgba(0, 0, 0, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 0 0 1px rgba(110, 168, 255, 0.10);
  }

  html[data-theme="space"] .sw-btn-download {
    background: rgba(110, 168, 255, 0.10);
    border-color: rgba(110, 168, 255, 0.22);
    color: #A8D8FF;
  }

  html[data-theme="space"] .sw-btn-download:hover {
    background: rgba(110, 168, 255, 0.18);
    border-color: rgba(110, 168, 255, 0.38);
    color: #E7F4FF;
    box-shadow: 0 0 0 3px rgba(110, 168, 255, 0.10);
  }
  html[data-theme="space"] .sw-btn-site:hover {
    border-color: rgba(110, 168, 255, 0.38);
    color: #A8D8FF;
  }

  html[data-theme="space"] .sw-note {
    border-color: rgba(251, 191, 36, 0.35);
    background: rgba(251, 191, 36, 0.10);
    color: #FCD34D;
  }

  @media (max-width: 640px) {
    .sw-page { padding: 22px 16px 70px; }
    .sw-header { flex-direction: column; }
    .sw-grid { grid-template-columns: 1fr; }
    .sw-card { min-height: 0; }
  }
</style>
</head>
<body>
<main class="sw-page">
  <section class="sw-header">
    <div>
      <h1 data-i18n="heroTitle">Software</h1>
    </div>
  </section>

  <section class="sw-toolbar">
    <input type="search" id="swSearch" class="sw-search" data-i18n-placeholder="searchPlaceholder" placeholder="Search software...">
    <div class="sw-cats" id="swCats"></div>
  </section>

  <div id="swContent"></div>

  <p class="sw-note" data-i18n="note">Links point to official websites or official download pages. If a direct download link is unavailable, open the official site and choose the version that matches your system.</p>
</main>

<footer class="footer">Helloxiaolaodi &#183; My Files</footer>

<script>
(function () {
  let CATEGORIES = [];

  let SOFTWARE = [];

  const I18N = {
    en: {
      pageTitle: 'Software',
      heroTitle: 'Software',
      searchPlaceholder: 'Search software...',
      all: 'All',
      download: 'Download',
      site: 'Official Site',
      note: 'Links point to official websites or official download pages. If a direct download link is unavailable, open the official site and choose the version that matches your system.',
      empty: 'No software matches your search.'
    },
    zh: {
      pageTitle: '软件',
      heroTitle: '软件',
      searchPlaceholder: '搜索软件...',
      all: '全部',
      download: '下载',
      site: '官网',
      note: '链接均指向官方网站或官方下载页面。如果没有直接下载链接，请打开官网后选择适合自己系统的版本。',
      empty: '没有找到匹配的软件。'
    }
  };

  const state = {
    lang: new URLSearchParams(location.search).get('lang') || ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en'),
    category: 'all',
    term: ''
  };

  const contentEl = document.getElementById('swContent');
  const catsEl = document.getElementById('swCats');
  const searchEl = document.getElementById('swSearch');

  /* ---- 跟随主应用主题（space=深色） ---- */
  function applyParentTheme() {
    let dark = false;
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        dark = window.parent.document.documentElement.dataset.theme === 'space';
      }
    } catch (e) { /* 独立打开时无父页面，保持浅色 */ }
    document.documentElement.dataset.theme = dark ? 'space' : '';
  }

  window.addEventListener('message', (event) => {
    const d = event.data;
    if (!d) return;
    if (d.type === 'alpehuez-theme') {
      document.documentElement.dataset.theme = d.theme === 'dark' ? 'space' : '';
    } else if (d.type === 'alpehuez-lang' && (d.lang === 'zh' || d.lang === 'en')) {
      state.lang = d.lang;
      applyLang();
    } else if (d.type === 'alpehuez-sw-category') {
      state.category = d.cat || 'all';
      state.term = '';
      if (searchEl) searchEl.value = '';
      renderCats();
      render();
      const section = document.getElementById('cat-' + state.category);
      if (section && section.scrollIntoView) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  });

  applyParentTheme();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function initials(name) {
    const parts = name.replace(/[()]/g, '').split(/[\s/]+/).filter(Boolean);
    return parts.slice(0, 2).map((p) => p[0]).join('').toUpperCase();
  }

  function renderCats() {
    catsEl.innerHTML = [
      `<button type="button" class="sw-cat" data-cat="all" aria-pressed="${state.category === 'all'}">${I18N[state.lang].all}</button>`,
      ...CATEGORIES.map((c) => `<button type="button" class="sw-cat" data-cat="${c.id}" aria-pressed="${state.category === c.id}">${escapeHtml(c[state.lang])}</button>`)
    ].join('');
  }

  function render() {
    const t = I18N[state.lang];
    const term = state.term.toLowerCase();
    const visible = SOFTWARE.filter((s) => {
      if (state.category !== 'all' && s.cat !== state.category) return false;
      if (!term) return true;
      return (s.name + ' ' + s.en + ' ' + s.zh).toLowerCase().includes(term);
    });

    const sections = CATEGORIES.map((cat) => {
      const items = visible.filter((s) => s.cat === cat.id);
      if (!items.length) return '';
      return `<section class="sw-section" id="cat-${cat.id}">
        <div class="sw-section-head">
          <h2>${escapeHtml(cat[state.lang])}</h2>
          <span class="sw-count">${items.length}</span>
        </div>
        <div class="sw-grid">
          ${items.map((s) => {
            // 三个按钮去重：URL 相同的只保留第一个按钮，避免 Download / Official Site / GitHub 出现重复。
            const norm = (u) => String(u || '').toLowerCase().replace(/\/+$/, '').replace(/^https?:/, '');
            const seen = new Set();
            const btns = [];
            const pushBtn = (url, label, cls) => {
              const key = norm(url);
              if (!url || seen.has(key)) return;
              seen.add(key);
              btns.push(`<a class="sw-btn ${cls}" href="${escapeHtml(url)}">${escapeHtml(label)}</a>`);
            };
            pushBtn(s.url, t.download, 'sw-btn-download');
            pushBtn(s.url, t.site, 'sw-btn-site');
            if (s.extra && s.extra.url) pushBtn(s.extra.url, s.extra[state.lang] || t.site, 'sw-btn-site');
            return `<article class="sw-card">
              <div class="sw-card-top">
                <div class="sw-logo" aria-hidden="true">${escapeHtml(initials(s.name))}</div>
                <div>
                  <h3>${escapeHtml(s.name)}</h3>
                  <p class="sw-desc">${escapeHtml(s[state.lang])}</p>
                </div>
              </div>
              <div class="sw-card-actions">
                ${btns.join('')}
              </div>
            </article>`;
          }).join('')}
        </div>
      </section>`;
    }).join('');

    contentEl.innerHTML = sections || `<div class="sw-empty">${escapeHtml(t.empty)}</div>`;
  }

  function applyLang() {
    const t = I18N[state.lang];
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    document.title = t.pageTitle;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t[el.getAttribute('data-i18n')];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
      el.placeholder = t[el.getAttribute('data-i18n-placeholder')];
    });
    renderCats();
    render();
  }

  catsEl.addEventListener('click', (event) => {
    const btn = event.target.closest('.sw-cat');
    if (!btn) return;
    state.category = btn.dataset.cat;
    renderCats();
    render();
  });

  searchEl.addEventListener('input', () => {
    state.term = searchEl.value;
    render();
  });

  /* ---- 按钮统一在应用内部打开（由主窗口创建内部 webview） ---- */
  // 注意：按钮 <a> 不能带 target="_blank"。WebView2 对 target="_blank" 的点击会触发
  // NewWindowRequested 并被路由到系统浏览器，即使 JS 已 preventDefault 也无济于事，
  // 结果就是"同时打开内部页面和外部浏览器"。因此这里一律用 JS 控制打开方式。
  const isDesktop = !!(window.__TAURI__ && window.__TAURI__.core);

  function openInternal(url) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'alpehuez-open-url', url, title: document.title }, '*');
      } else if (isDesktop) {
        window.__TAURI__.core.invoke('open_url', { url }).catch(() => {});
      }
    } catch (e) {
      console.error('open url failed:', e);
    }
  }

  contentEl.addEventListener('click', (event) => {
    const btn = event.target.closest('.sw-btn-download, .sw-btn-site');
    if (!btn) return;
    event.preventDefault();
    const url = btn.getAttribute('href');
    if (!isDesktop) {
      // 网页版（无 Tauri）没有内部 webview，在新标签页打开。
      window.open(url, '_blank', 'noopener');
      return;
    }
    openInternal(url);
  });

  async function loadData() {
    try {
      const res = await fetch('software-data.json', { cache: 'no-store' });
      const data = await res.json();
      CATEGORIES = data.categories || [];
      SOFTWARE = data.software || [];
      applyLang();
    } catch (e) {
      contentEl.innerHTML = '<div class="sw-empty">Failed to load software data.</div>';
    }
  }
  loadData();
})();
</script>
</body>
</html>
