<style>
  .tc-download-wrap {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  .tc-download-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 8px 14px;
    border: 1px solid #c7d2fe;
    border-radius: 8px;
    background: #fff;
    color: #4338ca;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .tc-download-btn:hover,
  .tc-download-btn[aria-expanded="true"] {
    background: #eef2ff;
    border-color: #a5b4fc;
  }
  .tc-download-btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .tc-download-menu {
    position: absolute;
    right: 0;
    bottom: calc(100% + 8px);
    min-width: 224px;
    padding: 6px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16);
  }
  .tc-download-menu[hidden] {
    display: none;
  }
  .tc-download-menu a {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 6px;
    color: #334155;
    text-decoration: none;
    white-space: nowrap;
  }
  .tc-download-menu a:hover {
    background: #f1f5f9;
    color: #4338ca;
  }
  @media (max-width: 640px) {
    .tc-download-wrap {
      right: 12px;
      bottom: 12px;
    }
    .tc-download-menu {
      min-width: 200px;
    }
  }
</style>
<div class="tc-download-wrap">
  <button type="button" class="tc-download-btn" aria-expanded="false" aria-controls="tc-download-menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    Download
  </button>
  <div class="tc-download-menu" id="tc-download-menu" hidden>
    <a href="#" id="tc-download-qmd" download>Download QMD</a>
    <a href="#" id="tc-download-figures" download>Download Figures ZIP</a>
  </div>
</div>
<script>
  (function () {
    var qmdLink = document.getElementById('tc-download-qmd');
    var figuresLink = document.getElementById('tc-download-figures');
    if (qmdLink && figuresLink) {
      var path = location.pathname.replace(/\.html?$/i, '').replace(/\/+$/, '');
      qmdLink.href = path + '.qmd';
      figuresLink.href = path + '-figures.zip';
    }
    var button = document.querySelector('.tc-download-btn');
    var menu = document.getElementById('tc-download-menu');
    function closeMenu() {
      if (!menu) return;
      menu.hidden = true;
      if (button) button.setAttribute('aria-expanded', 'false');
    }
    if (button && menu) {
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        var open = button.getAttribute('aria-expanded') === 'true';
        closeMenu();
        if (!open) {
          menu.hidden = false;
          button.setAttribute('aria-expanded', 'true');
        }
      });
      document.addEventListener('click', function (event) {
        if (!event.target.closest('.tc-download-wrap')) closeMenu();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeMenu();
      });
    }
  })();
</script>
