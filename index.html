<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人导航站</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        /* 修复了图片路径，去掉了 /images/ */
        body { background: url('1109770.jpg') no-repeat center center fixed; background-size: cover; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .scroll-mt-6 { scroll-margin-top: 1.5rem; }
    </style>
</head>
<body class="text-gray-100 flex h-screen overflow-hidden">

    <!-- 左侧边栏：分类菜单 -->
    <aside class="w-64 glass p-6 flex flex-col shadow-2xl z-10">
        <h1 class="text-2xl font-bold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">🚀 导航中心</h1>
        <nav id="sidebar" class="space-y-1 overflow-y-auto flex-1 pr-2">
            <!-- 动态渲染分类 -->
        </nav>
    </aside>

    <!-- 右侧主体：网址卡片 -->
    <main class="flex-1 p-8 md:p-12 overflow-y-auto relative">
        <div id="content" class="max-w-7xl mx-auto pb-20">
            <!-- 动态渲染网址 -->
        </div>
    </main>

    <script>
        // 读取本地 links.json 并渲染
        fetch('links.json')
            .then(res => res.json())
            .then(data => {
                const sidebar = document.getElementById('sidebar');
                const content = document.getElementById('content');
                
                // 适配 Sun-Panel 导出的 JSON 字段名
                let groups = data.icons || []; 
                
                groups.forEach((group, index) => {
                    // 1. 渲染左侧菜单 (对应 JSON 的 group.title)
                    sidebar.innerHTML += `
                        <a href="#group-${index}" class="block px-4 py-2.5 rounded-lg hover:bg-white/10 transition text-sm font-medium tracking-wide">
                            ${group.title}
                        </a>
                    `;
                    
                    // 2. 渲染右侧内容 (对应 JSON 的 group.children)
                    let itemsHtml = '';
                    if(group.children && group.children.length > 0) {
                        itemsHtml = group.children.map(item => {
                            // 提取图标，如果失败则用 Emoji 代替
                            let iconHtml = item.icon && item.icon.src 
                                ? `<img src="${item.icon.src}" class="w-8 h-8 rounded bg-white/90 p-1 object-contain" onerror="this.onerror=null;this.outerHTML='<span class=\\'text-2xl\\'>🔗</span>'">` 
                                : `<span class="text-2xl">🔗</span>`;

                            return `
                                <a href="${item.url}" target="_blank" class="glass p-4 rounded-xl hover:bg-white/10 hover:border-indigo-400/50 hover:shadow-[0_0_15px_rgba(99,102,241,0.2)] transition-all duration-300 flex items-center space-x-4">
                                    ${iconHtml}
                                    <div class="overflow-hidden flex-1">
                                        <h3 class="font-semibold text-white text-sm truncate">${item.title}</h3>
                                        <p class="text-xs text-gray-400 truncate mt-0.5">${item.url}</p>
                                    </div>
                                </a>
                            `;
                        }).join('');
                    }

                    // 将分类板块加入右侧
                    content.innerHTML += `
                        <div id="group-${index}" class="mb-10 scroll-mt-6">
                            <h2 class="text-xl font-bold mb-5 text-indigo-200 border-b border-white/10 pb-2 pl-1">${group.title}</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error("加载 links.json 失败:", err);
                document.getElementById('content').innerHTML = `<p class="text-red-400">数据加载失败，请检查 links.json 文件是否存在且格式正确。</p>`;
            });
    </script>
</body>
</html>
