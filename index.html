<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人导航站</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: url('/images/1109770.jpg') no-repeat center center fixed; background-size: cover; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-gray-100 flex h-screen overflow-hidden">

    <!-- 左侧边栏：分类菜单 -->
    <aside class="w-64 glass border-r border-gray-800 p-6 flex flex-col">
        <h1 class="text-xl font-bold mb-8 text-indigo-400">🚀 导航中心</h1>
        <nav id="sidebar" class="space-y-2 overflow-y-auto flex-1 pr-2">
            <!-- 动态渲染分类 -->
        </nav>
    </aside>

    <!-- 右侧主体：网址卡片 -->
    <main class="flex-1 p-10 overflow-y-auto">
        <div id="content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态渲染网址 -->
        </div>
    </main>

    <script>
        // 读取本地 links.json 并渲染
        fetch('links.json')
            .then(res => res.json())
            .then(data => {
                const sidebar = document.getElementById('sidebar');
                const content = document.getElementById('content');
                
                // 假设数据结构，你可以根据 Sun-Panel 导出的 JSON 结构微调字段名
                // 这里以标准分类渲染为例
                let groups = data.groups || []; 
                
                groups.forEach((group, index) => {
                    // 1. 渲染左侧菜单
                    sidebar.innerHTML += `<a href="#group-${index}" class="block px-4 py-2 rounded-lg hover:bg-indigo-600/50 transition">${group.name}</a>`;
                    
                    // 2. 渲染右侧内容
                    let itemsHtml = group.items.map(item => `
                        <a href="${item.url}" target="_blank" class="glass p-4 rounded-xl border border-gray-700/50 hover:border-indigo-500 transition flex items-center space-x-4">
                            <span class="text-2xl">🔗</span>
                            <div>
                                <h3 class="font-semibold text-white">${item.title}</h3>
                                <p class="text-xs text-gray-400 truncate w-48">${item.url}</p>
                            </div>
                        </a>
                    `).join('');

                    content.innerHTML += `<div id="group-${index}" class="col-span-full"><h2 class="text-lg font-bold mb-4 text-indigo-300 border-b border-gray-800 pb-2">${group.name}</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4">${itemsHtml}</div></div>`;
                });
            });
    </script>
</body>
</html>
